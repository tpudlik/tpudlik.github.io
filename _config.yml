# Site wide configuration

title:            Ted Pudlik
locale:           en_US
url:              https://www.tpudlik.com


# Jekyll configuration

permalink:   /:categories/:title/
markdown:    kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed
  # The fixes for these need Dart Sass module syntax, which GitHub Pages'
  # default build doesn't support. Revisit before upgrading to Dart Sass 3.0.
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - slash-div
plugins:
  - jekyll-sitemap

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false


# Site owner
owner:
  name: Ted Pudlik
  avatar: bio-photo.jpg
  bio:
  email: tpudlik@gmail.com
  github: tpudlik

exclude: ["Gemfile", "Gemfile.lock", "LICENSE", "README.md", "node_modules"]
